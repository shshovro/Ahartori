    <title>Ahartori</title>
    
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  
    <!-- Include jQuery Easing Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.3/jquery.easing.min.js"></script>
    
    <!-- Your custom JavaScript here -->
    <script>
      $(document).ready(function() {
        console.log("jQuery and jQuery Easing are loaded!");
      });
    </script>
    <div class="container2">
        <div class="header">
            <nav class="navbar">
                <div class="logo">
                    <img src="images/logo-01.png" alt="Ahartori Logo">
                </div>
                <a href="contact.html">Contact</a>
                <div class="dropdown">
                    <button class="dropbtn">Profile
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="dropdown-content">
                        <a href="signin.html">Sign In</a>
                        <a href="signup.html">Sign Up</a>
                    </div>
                </div> 
                <div class="dropdown2">
                    <button class="dropbtn2">Service
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="dropdown-content2">
                        <a href="service.html">Programmes</a>
                        <a href="chefs.html">Our Chefs</a>
                    </div>
                </div> 
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
            </nav>
        </div>
<form id="msform">
    <!-- progressbar -->
    <ul id="progressbar">
      <li class="active">Account Setup</li>
      <li>Social Profiles</li>
      <li>Personal Details</li>
    </ul>
    <!-- fieldsets -->
    <fieldset>
      <h2 class="fs-title">Create your account</h2>
      <h3 class="fs-subtitle">This is step 1</h3>
      <input type="text" name="email" placeholder="Email" />
      <input type="password" name="pass" placeholder="Password" />
      <input type="password" name="cpass" placeholder="Confirm Password" />
      <input type="button" name="next" class="next action-button" value="Next" />
    </fieldset>
    <fieldset>
      <h2 class="fs-title">Social Profiles</h2>
      <h3 class="fs-subtitle">Your presence on the social network</h3>
      <input type="text" name="twitter" placeholder="Twitter" />
      <input type="text" name="facebook" placeholder="Facebook" />
      <input type="text" name="gplus" placeholder="Google Plus" />
      <input type="button" name="previous" class="previous action-button" value="Previous" />
      <input type="button" name="next" class="next action-button" value="Next" />
    </fieldset>
    <fieldset>
      <h2 class="fs-title">Personal Details</h2>
      <h3 class="fs-subtitle">We will never sell it</h3>
      <input type="text" name="fname" placeholder="First Name" />
      <input type="text" name="lname" placeholder="Last Name" />
      <input type="text" name="phone" placeholder="Phone" />
      <textarea name="address" placeholder="Address"></textarea>
      <input type="button" name="previous" class="previous action-button" value="Previous" />
      <a href="" class="submit action-button" target="_top">Submit</a>
    </fieldset>
  </form>
</div>

  
</body>
</div>
