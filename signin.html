<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style13.css">
    <link rel="shortcut icon" type="image/png" href="images/icon-01.png">
    <title>Ahartori</title>
</head>
<body>
    <div class="container2">
        <div class="header">
            <nav class="navbar">
                <div class="logo">
                    <img src="images/logo-01.png" alt="Ahartori Logo">
                </div>
                <a href="contact.html">Contact</a>
                <div class="dropdown">
                    <button class="dropbtn">Profile
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="dropdown-content">
                        <a href="signin.html">Sign In</a>
                        <a href="signup.html">Sign Up</a>
                    </div>
                </div> 
                <div class="dropdown2">
                    <button class="dropbtn2">Service
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="dropdown-content2">
                        <a href="service.html">Programmes</a>
                        <a href="chefs.html">Our Chefs</a>
                    </div>
                </div> 
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
            </nav>
        </div>

        <div class="container">
            <div class="left">
                <img src="images/img13.png" alt="Illustration" style="width: 100%; height: auto;" width="400">
            </div>
            <div class="right">
                <!-- Login Form -->
                <form action="index2.html" method="POST">
                    <h2>Welcome!</h2>
                    <p>Sign up or log in to continue</p>
                    <input type="email" placeholder="youremail@gmail.com" id="email" name="email" required>
                    <input type="password" placeholder="Password" id="password" name="password" required>
                    <div class="checkbox-label">
                        <input type="checkbox" id="keep-logged-in" name="keep_logged_in">
                        <label for="keep-logged-in"><span>Keep me logged in</span></label>
                    </div>
                    <button type="button" class="login-btn" onclick="window.location.href='index2.html'">Log In</button>
                </form>
                <a href="#" class="forgot-password">Forgot Password?</a>
                <div class="social-login">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-google"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
                <div class="signup">
                    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
